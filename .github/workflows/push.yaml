name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - '*'
permissions:
  contents: write
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  create-release:
    name: Create Release 🛫
    # Version tags create the normal draft release only after every platform
    # succeeds. Every main-branch commit creates a uniquely tagged development
    # pre-release when the build run contains Windows artifacts, even if an
    # unfinished Linux/macOS port fails elsewhere in the reusable workflow.
    if: >-
      ${{
        !cancelled() &&
        (
          (github.ref_type == 'tag' && needs.build-project.result == 'success') ||
          github.ref_name == 'main'
        )
      }}
    runs-on: ubuntu-24.04
    needs: build-project
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Out Release Source 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Release Tag ☑️
        id: check
        env:
          PLUGIN_NAME: ${{ needs.build-project.outputs.pluginName || 'OBS Replay Timeline' }}
          PLUGIN_VERSION: ${{ needs.build-project.outputs.pluginVersion || '0.0.0' }}
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          if [[ "${GITHUB_REF_TYPE}" == 'branch' && "${GITHUB_REF_NAME}" == 'main' ]]; then
            short_hash="${GITHUB_SHA:0:9}"
            echo 'validTag=true' >> $GITHUB_OUTPUT
            echo 'prerelease=true' >> $GITHUB_OUTPUT
            echo 'draft=false' >> $GITHUB_OUTPUT
            echo 'assetScope=windows' >> $GITHUB_OUTPUT
            echo "version=build-${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}-${short_hash}" >> $GITHUB_OUTPUT
            echo "releaseName=${PLUGIN_NAME} - ${PLUGIN_VERSION}" >> $GITHUB_OUTPUT
            exit 0
          fi

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo 'draft=true' >> $GITHUB_OUTPUT
              echo 'assetScope=all' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              echo "releaseName=${PLUGIN_NAME} - ${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              echo 'draft=true' >> $GITHUB_OUTPUT
              echo 'assetScope=all' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              echo "releaseName=${PLUGIN_NAME} - ${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v4
        if: fromJSON(steps.check.outputs.validTag)
        id: download

      - name: Rename Files 🏷️
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Rename Files 🏷️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          root_dir="$(pwd)"
          commit_hash="${GITHUB_SHA:0:9}"

          if [[ '${{ steps.check.outputs.assetScope }}' == 'windows' ]]; then
            variants=('windows-x64;zip|exe')
          else
            variants=(
              'windows-x64;zip|exe'
              'macos-universal;tar.xz|pkg'
              'ubuntu-24.04-x86_64;tar.xz|deb|ddeb'
              'sources;tar.xz'
            )
          fi

          for variant_data in "${variants[@]}"; do
            IFS=';' read -r variant suffix <<< "${variant_data}"

            candidates=(*-${variant}-${commit_hash}/@(*|*-dbgsym).@(${suffix}))

            for candidate in "${candidates[@]}"; do
              mv "${candidate}" "${root_dir}"
            done
          done

      - name: Generate Release Notes and Checksums 🪪
        if: fromJSON(steps.check.outputs.validTag)
        env:
          PLUGIN_VERSION: ${{ needs.build-project.outputs.pluginVersion || '0.0.0' }}
        run: |
          : Generate Release Notes and Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          files=(${{ github.workspace }}/@(*.exe|*.deb|*.ddeb|*.pkg|*.tar.xz|*.zip))
          if (( ${#files} == 0 )); then
            echo 'No packaged artifacts were produced; refusing to create an empty release.' >&2
            exit 1
          fi

          if [[ '${{ steps.check.outputs.assetScope }}' == 'windows' ]]; then
            installers=(${{ github.workspace }}/*.exe)
            if (( ${#installers} == 0 )); then
              echo 'The Windows installer was not produced; refusing to create the development release.' >&2
              exit 1
            fi
          fi

          release_notes="${GITHUB_WORKSPACE}/docs/releases/${PLUGIN_VERSION}.md"
          if [[ ! -s "${release_notes}" ]]; then
            echo "Release notes are missing or empty: ${release_notes}" >&2
            exit 1
          fi
          if ! grep -Eq '^- .+' "${release_notes}"; then
            echo "Release notes must contain at least one bullet point: ${release_notes}" >&2
            exit 1
          fi
          if grep -Evq '^$|^- .+' "${release_notes}"; then
            echo "Release notes must contain only bullet points and blank lines: ${release_notes}" >&2
            exit 1
          fi

          {
            if [[ '${{ steps.check.outputs.assetScope }}' == 'windows' ]]; then
              echo "Automated development build from the latest commit on \`${GITHUB_REF_NAME}\`."
              echo
              echo "Commit: \`${GITHUB_SHA}\`"
              echo
              echo '> Development build: test before relying on it for important recordings.'
              echo
            fi

            echo '### Changes / fixes'
            cat "${release_notes}"
            echo
            echo '### Checksums'
          } > ${{ github.workspace }}/CHECKSUMS.txt

          for file in "${files[@]}"; do
            echo "    ${file##*/}: $(sha256sum "${file}" | cut -d " " -f 1)" >> ${{ github.workspace }}/CHECKSUMS.txt
          done

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        id: create_release
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        with:
          draft: ${{ fromJSON(steps.check.outputs.draft) }}
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.check.outputs.releaseName }}
          body_path: ${{ github.workspace }}/CHECKSUMS.txt
          files: |
            ${{ github.workspace }}/*.exe
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.pkg
            ${{ github.workspace }}/*.deb
            ${{ github.workspace }}/*.ddeb
            ${{ github.workspace }}/*.tar.xz
